# Logs liveuser straight into the default Wayland session (plasma.desktop from
# /usr/share/wayland-sessions/, which always ships with Plasma 6). Restart it
# automatically whenever the session exits.
#
# Live only. shellprocess@cleanup deletes this from the installed system, where
# liveuser is gone and Calamares' displaymanager module owns autologin.
[Autologin]
User=liveuser
Session=plasma.desktop
Relogin=true
