---
# Pinned rather than inherited from /usr/share/calamares/modules/users.conf so
# that root always gets a password. The live ISO ships root with an empty one
# and unpackfs copies that /etc/shadow to the target, so leaving this to an
# upstream default turns a security decision into an accident.
defaultGroups:
  - name: wheel
    must_exist: true
    system: false
  - video
  - audio
  - storage
  - network
  - lp
  - input

autologinGroup: autologin
sudoersGroup: wheel

setRootPassword: true
doReusePassword: false

passwordRequirements:
  minLength: 1
  maxLength: -1
