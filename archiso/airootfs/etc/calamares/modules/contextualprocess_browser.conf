---

dontChroot: false
packagechooser_browser:
    firefox:
        - command: "-/usr/local/bin/frog-install-browser.sh firefox"
          timeout: 10
    helium:
        - command: "-/usr/local/bin/frog-install-browser.sh helium-browser-bin"
          timeout: 600
    brave-origin:
        - command: "/bin/true"
          timeout: 600
    zen:
        - command: "-/usr/local/bin/frog-install-browser.sh zen-browser-bin"
          timeout: 600
    chromium:
        - command: "-/usr/local/bin/frog-install-browser.sh chromium"
          timeout: 600
