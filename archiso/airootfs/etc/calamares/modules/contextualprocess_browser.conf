---
# Reads globalStorage["packagechooser_browser"] and installs the pick in the
# target chroot, removing Firefox if it was not the pick.
#
# Every command is dash-prefixed so a failure is logged and skipped instead of
# aborting the install at 95%. Someone who picks Brave on a machine with no
# network should end up with the preinstalled Firefox, not a dead installation.
#
# Depends on shellprocess@cleanup having repaired the keyring first. The
# squashfs ships an empty /etc/pacman.d/gnupg, so signature checks fail without
# it.
dontChroot: false
packagechooser_browser:
    firefox:
        - command: "/bin/true"
          timeout: 10
    brave:
        - command: "-/usr/local/bin/frog-install-browser.sh brave-bin"
          timeout: 600
    zen:
        - command: "-/usr/local/bin/frog-install-browser.sh zen-browser-bin"
          timeout: 600
    chromium:
        - command: "-/usr/local/bin/frog-install-browser.sh chromium"
          timeout: 600
