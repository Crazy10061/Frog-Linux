---
# Required. Without it Calamares picks up the demo unpackfs.conf from
# /usr/share/calamares/modules/, which unpacks an upstream CHANGES file and a
# slideshow directory, and the install produces nothing.
#
# Path comes from releng's profiledef.sh: install_dir="arch", arch="x86_64",
# airootfs_image_type="squashfs". mkinitcpio-archiso mounts the boot medium at
# /run/archiso/bootmnt. Overriding airootfs_image_tool_options for zstd does not
# change the image type, so the .sfs extension holds.
unpack:
  - source: "/run/archiso/bootmnt/arch/x86_64/airootfs.sfs"
    sourcefs: "squashfs"
    destination: ""
