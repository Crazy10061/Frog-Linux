# Browser picker. The choice lands in globalStorage["packagechooser_browser"]
# and contextualprocess_browser.conf acts on it.
#
# No screenshot: keys. /usr/share/pixmaps is empty on the live ISO and the
# optional browsers are not installed there, so every path would render as a broken
# placeholder. Ship images under the branding directory to re-enable them.

mode: required
method: legacy
id: browser

default: firefox

items:
  - id: firefox
    package: firefox
    name: Firefox
    description: >
      Mozilla's open-source browser. Keep the pre-installed default.

  - id: brave
    package: brave-bin
    name: Brave
    description: >
      Privacy-focused Chromium fork with built-in ad blocking.

  - id: brave-origin
    package: brave-origin-bin
    name: Brave Origin
    description: >
      Minimalist browser from the makers of Brave.

  - id: zen
    package: zen-browser-bin
    name: Zen Browser
    description: >
      Beautiful Firefox-based browser with modern UX.

  - id: chromium
    package: chromium
    name: Chromium
    description: >
      Google's open-source browser.
