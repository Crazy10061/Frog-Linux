name: Build Frog Linux ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # plasma-meta, an nvidia-open-dkms build, the pacstrap tree and the squashfs
    # together get close to the ~14 GB a standard runner offers. These three
    # directories are worth about 10 GB and nothing here uses them.
    - name: Free disk space
      run: |
        set -euo pipefail
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                    /opt/hostedtoolcache /usr/local/share/boost
        df -h /

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3

    # Cached across runs, so the CachyOS keyring dance and the Calamares compile
    # only happen when docker/Dockerfile actually changes.
    - name: Build toolchain image
      uses: docker/build-push-action@v6
      with:
        context: ./docker
        tags: frog-linux-build:latest
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Identical to what scripts/build-local.sh runs. mkarchiso needs loop devices
    # and a pacstrap chroot, hence --privileged; BuildKit cannot do this in a
    # Dockerfile, which is why the ISO is built here rather than in the image.
    - name: Build Frog Linux ISO
      run: |
        set -euo pipefail
        docker run --rm --privileged \
          --security-opt seccomp=unconfined \
          --security-opt apparmor=unconfined \
          -v "$PWD:/build" \
          -w /build \
          frog-linux-build:latest \
          /build/scripts/build-in-container.sh

    - name: Upload Frog Linux ISO
      uses: actions/upload-artifact@v4
      with:
        name: Frog-Linux-ISO
        path: ./output/*.iso
        if-no-files-found: error
